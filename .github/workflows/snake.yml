name: Generate Snake Contribution Animation

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: anuragsrawat
          github_token: ${{ secrets.SNAKE_TOKEN }}
          outputs: |
            dist/snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#c4b5fd,#a78bfa,#8b5cf6,#6d28d9&color_dot_border=#ffffff&sizeDotBorderRadius=4
            dist/snake-dark.svg?color_snake=#22d3ee&color_dots=#161b22,#0e7490,#06b6d4,#22d3ee,#a5f3fc&color_dot_border=#0d1117&sizeDotBorderRadius=4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
